{% extends "base.html" %}

{% block title %}Change Password - Awwalu Devs{% endblock %}

{% block content %}
<style>
  /* ============================================
     CHANGE PASSWORD - Premium Theme
     ============================================ */
  .change-password-page {
    min-height: calc(100vh - var(--nav-height, 68px) - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .password-container {
    max-width: 480px;
    width: 100%;
    background: var(--white, #FFFFFF);
    border-radius: var(--radius, 16px);
    border: 1px solid rgba(15, 23, 42, 0.04);
    box-shadow: var(--shadow-lg, 0 12px 48px rgba(15, 23, 42, 0.08));
    padding: 40px 36px 36px;
    transition: var(--transition, 0.3s ease);
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    position: relative;
    overflow: hidden;
  }

  .password-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--blue, #2563EB), var(--cyan, #22D3EE));
    opacity: 0.6;
  }

  .password-container:hover {
    box-shadow: var(--shadow-xl, 0 20px 60px rgba(15, 23, 42, 0.12));
  }

  /* Header */
  .password-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .password-header .icon-wrapper {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(34, 211, 238, 0.06));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    color: var(--blue, #2563EB);
    transition: var(--transition, 0.3s ease);
  }

  .password-container:hover .icon-wrapper {
    transform: scale(1.04);
    box-shadow: 0 4px 20px rgba(37, 99, 235, 0.08);
  }

  .password-header h2 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--navy, #0F172A);
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }

  .password-header h2 span {
    background: linear-gradient(135deg, var(--blue, #2563EB), var(--cyan, #22D3EE));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .password-header p {
    font-size: 0.9rem;
    color: var(--text-light, #64748B);
    margin: 0;
  }

  /* Form */
  .password-form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group label {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text, #1E293B);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-group label i {
    color: var(--blue, #2563EB);
    font-size: 0.85rem;
    width: 18px;
    text-align: center;
  }

  .form-group .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .form-group .input-wrapper input {
    width: 100%;
    padding: 12px 16px;
    padding-right: 48px;
    border-radius: var(--radius-sm, 10px);
    border: 1.5px solid rgba(15, 23, 42, 0.06);
    background: var(--bg, #F8FAFC);
    font-size: 0.9rem;
    font-family: 'Inter', sans-serif;
    color: var(--text, #1E293B);
    transition: var(--transition, 0.3s ease);
    outline: none;
  }

  .form-group .input-wrapper input:focus {
    border-color: var(--blue, #2563EB);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    background: var(--white, #FFFFFF);
  }

  .form-group .input-wrapper input::placeholder {
    color: var(--text-muted, #94A3B8);
    font-size: 0.85rem;
  }

  .form-group .input-wrapper .toggle-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted, #94A3B8);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    transition: var(--transition, 0.3s ease);
    font-size: 0.9rem;
  }

  .form-group .input-wrapper .toggle-password:hover {
    color: var(--text, #1E293B);
    background: rgba(15, 23, 42, 0.04);
  }

  /* Password Strength Indicator */
  .password-strength {
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .password-strength .strength-bar {
    flex: 1;
    height: 4px;
    background: rgba(15, 23, 42, 0.06);
    border-radius: 4px;
    overflow: hidden;
  }

  .password-strength .strength-bar .strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    transition: var(--transition, 0.3s ease);
  }

  .password-strength .strength-text {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted, #94A3B8);
    min-width: 56px;
    text-align: right;
  }

  /* Submit Button */
  .btn-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 60px;
    font-weight: 600;
    font-size: 0.9rem;
    background: linear-gradient(135deg, var(--blue, #2563EB), var(--cyan, #22D3EE));
    color: var(--white, #FFFFFF);
    border: none;
    cursor: pointer;
    transition: var(--transition, 0.3s ease);
    box-shadow: 0 2px 16px rgba(37, 99, 235, 0.15);
    margin-top: 4px;
    width: 100%;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 28px rgba(37, 99, 235, 0.25);
    color: var(--white, #FFFFFF);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  .btn-submit i {
    font-size: 0.95em;
  }

  /* Footer */
  .password-footer {
    text-align: center;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(15, 23, 42, 0.04);
  }

  .password-footer a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-light, #64748B);
    text-decoration: none;
    transition: var(--transition, 0.3s ease);
  }

  .password-footer a:hover {
    color: var(--blue, #2563EB);
    transform: translateX(-4px);
  }

  /* Animations */
  @keyframes fadeUp {
    0% {
      opacity: 0;
      transform: translateY(20px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .change-password-page {
      padding: 30px 16px;
    }

    .password-container {
      padding: 32px 24px 28px;
    }

    .password-header .icon-wrapper {
      width: 56px;
      height: 56px;
      font-size: 1.5rem;
    }

    .password-header h2 {
      font-size: 1.3rem;
    }

    .form-group .input-wrapper input {
      padding: 11px 14px;
      padding-right: 44px;
      font-size: 0.85rem;
    }

    .btn-submit {
      padding: 12px 24px;
      font-size: 0.85rem;
    }
  }

  @media (max-width: 480px) {
    .password-container {
      padding: 24px 16px 20px;
    }

    .password-header .icon-wrapper {
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
    }

    .password-header h2 {
      font-size: 1.1rem;
    }

    .password-header p {
      font-size: 0.82rem;
    }

    .form-group label {
      font-size: 0.78rem;
    }

    .form-group .input-wrapper input {
      padding: 10px 12px;
      padding-right: 40px;
      font-size: 0.82rem;
    }

    .btn-submit {
      padding: 11px 20px;
      font-size: 0.82rem;
    }

    .password-footer a {
      font-size: 0.8rem;
    }
  }

  /* Dark Mode */
  [data-theme="dark"] .password-container {
    background: var(--white, #1E293B);
    border-color: rgba(255, 255, 255, 0.04);
  }

  [data-theme="dark"] .password-container::before {
    background: linear-gradient(90deg, var(--blue, #2563EB), var(--cyan, #22D3EE));
  }

  [data-theme="dark"] .password-header h2 {
    color: var(--white, #FFFFFF);
  }

  [data-theme="dark"] .password-header .icon-wrapper {
    background: rgba(37, 99, 235, 0.12);
  }

  [data-theme="dark"] .form-group label {
    color: var(--white, #FFFFFF);
  }

  [data-theme="dark"] .form-group .input-wrapper input {
    background: rgba(255, 255, 255, 0.03);
    border-color: rgba(255, 255, 255, 0.06);
    color: var(--white, #FFFFFF);
  }

  [data-theme="dark"] .form-group .input-wrapper input:focus {
    border-color: var(--cyan, #22D3EE);
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.08);
    background: rgba(255, 255, 255, 0.05);
  }

  [data-theme="dark"] .form-group .input-wrapper input::placeholder {
    color: var(--text-muted, #64748B);
  }

  [data-theme="dark"] .form-group .input-wrapper .toggle-password {
    color: var(--text-muted, #64748B);
  }

  [data-theme="dark"] .form-group .input-wrapper .toggle-password:hover {
    color: var(--white, #FFFFFF);
    background: rgba(255, 255, 255, 0.04);
  }

  [data-theme="dark"] .password-footer {
    border-top-color: rgba(255, 255, 255, 0.04);
  }

  [data-theme="dark"] .password-footer a {
    color: var(--text-muted, #64748B);
  }

  [data-theme="dark"] .password-footer a:hover {
    color: var(--cyan, #22D3EE);
  }

  [data-theme="dark"] .password-strength .strength-bar {
    background: rgba(255, 255, 255, 0.06);
  }

  [data-theme="dark"] .password-strength .strength-text {
    color: var(--text-muted, #64748B);
  }

  [data-theme="dark"] .btn-submit {
    box-shadow: 0 2px 16px rgba(37, 99, 235, 0.12);
  }

  [data-theme="dark"] .btn-submit:hover {
    box-shadow: 0 4px 28px rgba(37, 99, 235, 0.2);
  }

  /* Error state for inputs */
  .form-group .input-wrapper input.error {
    border-color: #EF4444;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.08);
  }

  .form-group .input-wrapper input.error:focus {
    border-color: #EF4444;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
  }

  .error-message {
    font-size: 0.78rem;
    color: #EF4444;
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .error-message i {
    font-size: 0.7rem;
  }
</style>

<div class="change-password-page">
  <div class="password-container">
    <!-- Header -->
    <div class="password-header">
      <div class="icon-wrapper">
        <i class="fas fa-key"></i>
      </div>
      <h2>Change <span>Password</span></h2>
      <p>Update your password to keep your account secure</p>
    </div>

    <!-- Form -->
    <form method="POST" class="password-form" id="passwordForm">
      <!-- Current Password -->
      <div class="form-group">
        <label for="current_password"><i class="fas fa-lock"></i> Current Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="current_password" 
            name="current_password" 
            placeholder="Enter your current password" 
            required
          >
          <button type="button" class="toggle-password" onclick="togglePassword('current_password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="new_password"><i class="fas fa-key"></i> New Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="new_password" 
            name="new_password" 
            placeholder="Enter new password (min 6 chars)" 
            required
            minlength="6"
            oninput="checkPasswordStrength(this.value)"
          >
          <button type="button" class="toggle-password" onclick="togglePassword('new_password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="password-strength" id="strengthIndicator" style="display: none;">
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
          <span class="strength-text" id="strengthText">Weak</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirm_password"><i class="fas fa-check-circle"></i> Confirm Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="confirm_password" 
            name="confirm_password" 
            placeholder="Confirm new password" 
            required
            oninput="validateConfirmPassword()"
          >
          <button type="button" class="toggle-password" onclick="togglePassword('confirm_password')">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="error-message" id="confirmError" style="display: none;">
          <i class="fas fa-exclamation-circle"></i> Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <i class="fas fa-save"></i> Update Password
      </button>
    </form>

    <!-- Footer -->
    <div class="password-footer">
      <a href="{{ url_for('profile') }}">
        <i class="fas fa-arrow-left"></i> Back to Profile
      </a>
    </div>
  </div>
</div>

<script>
  // Toggle password visibility
  function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const btn = input.parentElement.querySelector('.toggle-password');
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
    } else {
      input.type = 'password';
      btn.innerHTML = '<i class="fas fa-eye"></i>';
    }
  }

  // Password strength checker
  function checkPasswordStrength(password) {
    const indicator = document.getElementById('strengthIndicator');
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');

    if (password.length === 0) {
      indicator.style.display = 'none';
      return;
    }

    indicator.style.display = 'flex';

    let score = 0;
    if (password.length >= 8) score++;
    if (password.match(/[a-z]/)) score++;
    if (password.match(/[A-Z]/)) score++;
    if (password.match(/[0-9]/)) score++;
    if (password.match(/[^a-zA-Z0-9]/)) score++;

    const strengths = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];
    const colors = ['#EF4444', '#F59E0B', '#F59E0B', '#059669', '#059669'];
    const widths = ['20%', '40%', '60%', '80%', '100%'];

    const index = Math.min(score, strengths.length - 1);
    fill.style.width = widths[index];
    fill.style.background = colors[index];
    text.textContent = strengths[index];
    text.style.color = colors[index];
  }

  // Validate confirm password
  function validateConfirmPassword() {
    const newPass = document.getElementById('new_password').value;
    const confirmPass = document.getElementById('confirm_password').value;
    const error = document.getElementById('confirmError');
    const submitBtn = document.getElementById('submitBtn');

    if (confirmPass.length > 0 && newPass !== confirmPass) {
      error.style.display = 'flex';
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.5';
      submitBtn.style.cursor = 'not-allowed';
    } else {
      error.style.display = 'none';
      submitBtn.disabled = false;
      submitBtn.style.opacity = '1';
      submitBtn.style.cursor = 'pointer';
    }
  }

  // Form submit validation
  document.getElementById('passwordForm').addEventListener('submit', function(e) {
    const newPass = document.getElementById('new_password').value;
    const confirmPass = document.getElementById('confirm_password').value;

    if (newPass !== confirmPass) {
      e.preventDefault();
      document.getElementById('confirmError').style.display = 'flex';
      document.getElementById('confirm_password').classList.add('error');
      return;
    }

    if (newPass.length < 6) {
      e.preventDefault();
      alert('Password must be at least 6 characters long.');
      return;
    }
  });

  // Remove error state on input
  document.getElementById('confirm_password').addEventListener('input', function() {
    this.classList.remove('error');
  });
</script>
{% endblock %}

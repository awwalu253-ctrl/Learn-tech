services:
  - type: web
    name: awwaludevs-backend
    runtime: python
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python migrate_db.py
    startCommand: |
      cd backend
      gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: awwaludevs-db
          property: connectionString
      - key: FLASK_DEBUG
        value: False
      - key: RENDER
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONUNBUFFERED
        value: true

databases:
  - name: awwaludevs-db
    plan: free
    databaseName: awwaludevs_db
    user: awwaludevs_user